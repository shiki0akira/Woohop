<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 跟 Woohop 首頁同一個淺灰底 -->
    <meta name="theme-color" content="#f4f4f6" />
    <title>{{pageTitle}}</title>
    <meta name="description" content="{{pageDesc}}" />
    <link rel="canonical" href="{{canonical}}" />
    {{hreflang}}

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Woohop" />
    <meta property="og:title" content="{{pageTitle}}" />
    <meta property="og:description" content="{{pageDesc}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:locale" content="{{ogLocale}}" />
    <!-- 分享縮圖：apps/homepage 的 `node scripts/og-image.mjs bingo` 產生到 public/og/，改了標題或插圖要重跑 -->
    <meta property="og:image" content="{{siteOrigin}}{{base}}/og/{{lang}}.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{navTitle}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 系列共用的 GA4 資源，跟首頁同一個 ID。
         send_page_view 關掉自動送出，改由 app.js 依畫面手動送——遊戲頁的幾個畫面
         共用同一個網址，自動送只會看到一筆，看不出有多少人真的開了房間。 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S7PE5687BG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-S7PE5687BG', { send_page_view: false });
    </script>

    <link rel="icon" href="{{base}}/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{{base}}/apple-touch-icon.png" />

    <!-- Woohop 全站樣式（唯一來源在 apps/homepage/assets，build 時複製進來）＋這個遊戲自己的 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{base}}/woohop/woohop.css?v={{assetVersion}}" />
    <link rel="stylesheet" href="{{base}}/woohop/site.css?v={{assetVersion}}" />
    <link rel="stylesheet" href="{{base}}/woohop/game.css?v={{assetVersion}}" />
    <link rel="stylesheet" href="{{base}}/app.css?v={{assetVersion}}" />
