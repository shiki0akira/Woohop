<!doctype html>
<html lang="{{htmlLang}}">
  <head>
    {{head}}
    {{jsonLd}}
  </head>

  <body class="bamboo-app woohop-game" data-screen="setup" data-game-mode="browse">
    {{header}}

    <main id="main" class="bamboo-main game-main">
      <!-- 第 1 步：選主題 -->
      <div class="view" id="view-setup">
        <div class="page-head">
          <nav class="crumbs" aria-label="breadcrumb">
            <a href="/{{lang}}/">{{crumbHome}}</a><span>›</span><a href="/{{lang}}/games/">{{crumbGames}}</a><span>›</span><span>{{navTitle}}</span>
          </nav>
          <h1>{{heroTitleHtml}}</h1>
          <p>{{heroDesc}}</p>
        </div>

        <div class="lead-slot"></div>

        <section class="panel">
          <h2>{{themeHeading}}</h2>
          <!-- 「隨機」＋六個主題＋「用本名」：全站共用的 Leader.themes（game.js）依名稱庫產生 -->
          <div class="theme-grid" id="theme-grid" role="group" aria-label="{{themeHeading}}"></div>
        </section>

        <button class="btn btn-lg btn-solid btn-block btn-start" id="start" type="button">{{startNaming}}</button>
        <p class="rules-link"><a class="link" href="{{base}}/{{lang}}/rules/">{{rulesLinkText}}</a></p>
      </div>

      <!--
        第 2 步：大家取名。手機傳一圈，每個人抽一個或自己大聲說（CONCEPT.md 3.1）。
        抽卡、自己取、名單、「大家都取好了」都是全站共用的 Leader.namer（game.js）畫在 #namer-root
      -->
      <div class="view" id="view-name" hidden>
        <div class="lead-slot"></div>
        <div id="namer-root"></div>
      </div>

      <!-- 第 3 步：說明規則。主持人照著念，三張插圖卡給大家看（用本名時這是第 2 步） -->
      <div class="view" id="view-rules" hidden>
        <div class="lead-slot"></div>
        <ol class="rule-cards" id="rule-cards"></ol>
        <button class="btn btn-lg btn-solid btn-block btn-start" id="rules-next" type="button">{{rulesNext}}</button>
      </div>

      <!-- 開始玩。手機不當裁判、不記數字（CONCEPT.md 2.2）。大家的名稱併在上面的「照著念」裡，主持人照順序念一遍（renderLead） -->
      <div class="view" id="view-play" hidden>
        <div class="lead-slot"></div>
        <section class="panel round-panel">
          <!-- 口令的七個字。配樂的七拍會一個一個亮起來，主持人跟著喊（app.js 的 playChant） -->
          <div class="chant" id="chant" aria-hidden="true"></div>
          <button class="btn btn-lg btn-solid btn-block round-btn" id="round-btn" type="button">{{startRound}}</button>
          <p class="hint play-hint" id="play-hint">{{playHintIdle}}</p>
        </section>
      </div>

      <!-- 這輪結束：輸的人拉分享拉霸（redesign-plan §5.1：把暖場轉成認識彼此） -->
      <div class="view" id="view-end" hidden>
        <div class="lead-slot"></div>
        <section class="panel end-card">
          <!--
            拉霸：題目在窗格裡往上滾，越滾越慢，停在中間那一格（app.js 的 spinSlot）。
            停下來的題目另外寫進 #slot-result 給螢幕閱讀器念，滾動中的那一長串藏起來。
          -->
          <!-- 真心話大冒險拉霸：全站共用的 Leader.slot（game.js）畫在這裡 -->
          <div id="slot-root"></div>
        </section>
        <!-- 「再一輪」放在拉霸卡片外面（使用者要求）。不黏底：這一頁比手機畫面高，黏著的話會蓋住「拉一下！」 -->
        <button class="btn btn-lg btn-solid btn-block" id="again" type="button">{{againButton}}</button>
      </div>
    </main>

    <!-- 回到開頭的確認：取名取到一半、或在玩的畫面按返回時（CONCEPT.md 3.5） -->
    <dialog class="modal" id="leave-modal">
      <div class="m-body">
        <h2>{{leaveTitle}}</h2>
        <p>{{leaveDesc}}</p>
      </div>
      <div class="m-actions">
        <button class="btn btn-secondary" id="leave-cancel" type="button">{{leaveCancel}}</button>
        <button class="btn btn-danger" id="leave-confirm" type="button">{{leaveConfirm}}</button>
      </div>
    </dialog>

    {{footer}}

    <script>
      window.BAMBOO = {
        lang: '{{lang}}',
        base: '{{base}}',
        T: {{stringsJson}},
        names: {{namesJson}},
        slot: {{slotJson}},
      };
    </script>
    <script src="{{base}}/header.js?v={{assetVersion}}"></script>
    <script src="{{base}}/app.js?v={{assetVersion}}"></script>
  </body>
</html>
