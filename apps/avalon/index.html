<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 跟 Woohop 其他頁面同一個淺灰底；深色模式時由下面那段改成深色 -->
    <meta name="theme-color" content="#f4f4f6" />
    <script>
      /* 顯示模式：選過就用選的（localStorage web100-theme，系列共用），沒選過就跟隨裝置。
         要在畫面畫出來之前決定，深色的人才不會先看到一下淺色（之後的切換在 src/context/ThemeContext.jsx） */
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('web100-theme'); } catch (e) {}
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) document.querySelector('meta[name=theme-color]').setAttribute('content', '#1c1c24');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
    <!-- 根目錄絕對路徑：postbuild 把 index.html 搬進 dist/avalon/，但 public 的檔案留在 dist 根目錄；
         掛到 www.vibeweb100.com/avalon/* 時也是抓首頁那份同一個檔案 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>阿瓦隆語音主持 | 阿瓦隆台詞旁白自動產生器</title>
    <meta name="description" content="阿瓦隆語音自動幫你生成主持人的阿瓦隆台詞與旁白，設定人數、角色後直接開局，不用自己背台詞。支援繁體中文，內建阿瓦隆規則說明。" />
    <link rel="canonical" href="https://www.vibeweb100.com/avalon/zh-TW" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="阿瓦隆語音主持 - 阿瓦隆台詞旁白自動產生，開局免背稿" />
    <meta property="og:description" content="設定人數與角色，阿瓦隆語音自動唸出主持人台詞和旁白，帶你完整跑完一場遊戲。" />
    <meta property="og:url" content="https://www.vibeweb100.com/avalon/zh-TW" />
    <!-- 分享縮圖：apps/homepage 的 node scripts/og-image.mjs avalon 產生到 public/og/，預渲染時換成各語言那張 -->
    <meta property="og:image" content="https://www.vibeweb100.com/avalon/og/zh-TW.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S7PE5687BG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      // send_page_view 關閉自動送出，改由 App.jsx 在每次路由/語言切換時手動送出，
      // 這樣 SPA 內部切換頁面（首頁 -> 遊戲 -> 規則）才會各自被記錄成一次 page_view
      gtag('config', 'G-S7PE5687BG', { send_page_view: false });
    </script>
  </head>
  <!-- Woohop 遊戲頁的版型（game.css）：woohop-game＋data-game-mode="browse"（阿瓦隆沒有「玩的時候」那種收起分頁的狀態） -->
  <body class="woohop-game avalon-app" data-game-mode="browse">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
