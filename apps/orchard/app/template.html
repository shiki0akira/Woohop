<!doctype html>
<html lang="{{htmlLang}}">
  <head>
    {{head}}
    {{jsonLd}}
  </head>

  <body class="orchard-app woohop-game" data-screen="setup" data-game-mode="browse">
    {{header}}

    <main id="main" class="orchard-main game-main">
      <!-- 第 1 步：設定人數。上方的步驟頭是全站共用的 Leader.lead -->
      <div class="view" id="view-setup">
        <div class="page-head">
          <nav class="crumbs" aria-label="breadcrumb">
            <a href="/{{lang}}/">{{crumbHome}}</a><span>›</span><a href="/{{lang}}/games/">{{crumbGames}}</a><span>›</span><span>{{navTitle}}</span>
          </nav>
          <h1>{{heroTitleHtml}}</h1>
          <p>{{heroDesc}}</p>
        </div>

        <div class="lead-slot"></div>

        <section class="panel count-panel">
          <h2>{{countHeading}}</h2>
          <div class="stepper">
            <button type="button" id="count-less" aria-label="{{countLess}}">−</button>
            <output id="count-value" aria-live="polite"></output>
            <button type="button" id="count-more" aria-label="{{countMore}}">+</button>
          </div>
        </section>

        <button class="btn btn-lg btn-solid btn-block btn-start" id="start" type="button">{{startButton}}</button>
        <p class="rules-link"><a class="link" href="{{base}}/{{lang}}/rules/">{{rulesLinkText}}</a></p>
      </div>

      <!-- 第 2 步：說明規則。三張插圖卡講規則（Leader.ruleCards） -->
      <div class="view" id="view-rules" hidden>
        <div class="lead-slot"></div>
        <ol class="rule-cards" id="rule-cards"></ol>
        <button class="btn btn-lg btn-solid btn-block btn-start" id="rules-next" type="button">{{rulesNext}}</button>
      </div>

      <!-- 第 3 步：開始。先出主題（隨機），下面是節拍器，再下面是自己選主題；手機不當裁判，主持人決定什麼時候結束 -->
      <div class="view" id="view-play" hidden>
        <div class="lead-slot"></div>
        <section class="panel topic-panel">
          <h2>{{topicHeading}}</h2>
          <div class="topic-card" aria-live="polite">
            <strong id="topic-name"></strong>
            <span id="topic-say"></span>
          </div>
          <button class="btn btn-secondary btn-block topic-shuffle" id="topic-shuffle" type="button">{{topicShuffle}}</button>
          <p class="hint">{{playHint}}</p>
        </section>
        <section class="panel metro-panel">
          <div id="metro-root"></div>
        </section>
        <!-- 自己選主題放在節拍器下面：進行中主持人最常按的是「隨機換一個」和節拍器，清單很長不要擋在中間 -->
        <section class="panel topic-pick-panel">
          <h2>{{topicPick}}</h2>
          <div class="topic-chips" id="topic-chips"></div>
        </section>
        <!-- 結束要按住，防手滑（跟竹筍同一個做法，app.js 的 HOLD_MS） -->
        <button class="btn btn-lg btn-block end-btn" id="end-btn" type="button">{{endGame}}</button>
      </div>

      <!-- 第 4 步：誰輸了。誰要拉由主持人決定（輸過的都拉，或只讓最輸的拉），拉霸可以一直再拉 -->
      <div class="view" id="view-end" hidden>
        <div class="lead-slot"></div>
        <section class="panel">
          <div id="slot-root"></div>
        </section>
        <button class="btn btn-lg btn-solid btn-block" id="again" type="button">{{againButton}}</button>
      </div>
    </main>

    <dialog class="modal" id="leave-modal">
      <div class="m-body">
        <h2>{{leaveTitle}}</h2>
        <p>{{leaveDesc}}</p>
      </div>
      <div class="m-actions">
        <button class="btn btn-secondary" id="leave-cancel" type="button">{{leaveCancel}}</button>
        <button class="btn btn-danger" id="leave-confirm" type="button">{{leaveConfirm}}</button>
      </div>
    </dialog>

    {{footer}}

    <script>
      window.ORCHARD = {
        lang: '{{lang}}',
        base: '{{base}}',
        T: {{stringsJson}},
        slot: {{slotJson}},
      };
    </script>
    <script src="{{base}}/header.js?v={{assetVersion}}"></script>
    <script src="{{base}}/app.js?v={{assetVersion}}"></script>
  </body>
</html>
