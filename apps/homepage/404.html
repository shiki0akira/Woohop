<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f6" />
    <!-- 深淺模式：跟全站同一段（chrome.mjs 的 THEME_HEAD）。這頁沒有頁尾的切換鈕，照記住的選擇或裝置 -->
    <script>(function(){var s=null;try{s=localStorage.getItem('web100-theme')}catch(e){}var d=s==='dark'||(s!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');if(d){var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content','#1c1c24')}})()</script>
    <!-- 404 不該被收錄。Vercel 會以 404 狀態碼回這一頁，這行只是雙保險 -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>找不到這個頁面 - Woohop</title>

    <!--
      這一頁是獨立的，不經過 scripts/prerender.js 的多語言產生流程：
      404 沒有語言網址（/it/ 和 /xyz 都會落到這裡），沒辦法預先決定語言，
      所以文案八種語言全部內嵌，執行期依 cookie → localStorage → 瀏覽器語言挑一種。
      反正 noindex，不需要為 SEO 做預渲染。

      樣式直接用設計系統的 /assets/woohop.css（按鈕、wordmark、插圖），這裡只排版面。
      插圖是設計系統頁的「找不到」（extraArt.empty），用 woohop-art.js 的小工具畫。
      這裡的路徑要用絕對路徑：/xyz/abc 這種深層網址也會回這一頁。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/woohop.css" />
    <style>
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
      header { padding: 20px 16px 0; display: flex; justify-content: center; }
      main { flex: 1; display: grid; place-items: center; padding: 24px 16px 64px; }
      .lost { width: min(480px, 100%); text-align: center; display: grid; justify-items: center; gap: 12px; }
      .lost svg.illo { width: min(240px, 64vw); height: auto; }
      .lost .code { margin: 0; font-family: "Fredoka", "Nunito", system-ui, sans-serif; font-weight: 700; font-size: clamp(56px, 16vw, 88px); line-height: 1; letter-spacing: -0.02em; color: var(--indigo-edge); }
      .lost h1 { margin: 0; font-size: clamp(24px, 6vw, 32px); line-height: 1.25; }
      .lost .lead { margin: 0 0 12px; color: var(--muted); line-height: 1.6; }
      .lost .lead span { display: inline-block; text-wrap: balance; }
      .lost h1 { text-wrap: balance; }
      .lost .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .lost .actions .btn { text-decoration: none; }
    </style>
  </head>

  <body>
    <header>
      <a class="wordmark" href="/" id="brand" aria-label="Woohop"><svg viewBox="0 0 59 48" aria-hidden="true"><use href="#w" fill="#7489E6" /></svg>Woohop</a>
    </header>

    <main>
      <div class="lost">
        <svg class="illo" id="art" viewBox="0 0 160 126" aria-hidden="true"></svg>
        <p class="code" aria-hidden="true">404</p>
        <h1 id="title">找不到這個頁面</h1>
        <p class="lead" id="lead"></p>
        <div class="actions">
          <a class="btn btn-lg btn-solid" href="/" id="home-btn"></a>
          <a class="btn btn-lg btn-secondary" href="/zh-TW/games/" id="games-btn"></a>
        </div>
      </div>
    </main>

    <script src="/assets/woohop-art.js"></script>
    <script>
      (function () {
        var SUPPORTED = ['zh-TW', 'en', 'de', 'fr', 'ja', 'ko', 'es', 'zh-CN'];
        var DEFAULT_LANG = 'zh-TW';

        var STRINGS = {
          'zh-TW': {
            title: '找不到這個頁面',
            lead: '這個網址可能已經移除、改過，或是網址打錯了。從首頁開始找找看吧。',
            home: '回首頁',
            games: '找遊戲'
          },
          en: {
            title: 'Page not found',
            lead: 'This page may have been removed or renamed, or the address was mistyped. Start again from the home page.',
            home: 'Go to home',
            games: 'Find games'
          },
          de: {
            title: 'Seite nicht gefunden',
            lead: 'Diese Seite wurde vielleicht entfernt oder umbenannt, oder die Adresse enthält einen Tippfehler. Fang am besten auf der Startseite neu an.',
            home: 'Zur Startseite',
            games: 'Spiele finden'
          },
          fr: {
            title: 'Page introuvable',
            lead: 'Cette page a peut-être été supprimée ou renommée, ou l’adresse comporte une faute. Repartez de la page d’accueil.',
            home: 'Aller à l’accueil',
            games: 'Trouver un jeu'
          },
          ja: {
            title: 'ページが見つかりません',
            lead: 'このページは削除または移動されたか、URLが間違っている可能性があります。トップページから探してみてください。',
            home: 'トップページへ',
            games: 'ゲームを探す'
          },
          ko: {
            title: '페이지를 찾을 수 없습니다',
            lead: '이 페이지는 삭제되거나 주소가 바뀌었을 수 있고, 주소를 잘못 입력했을 수도 있습니다. 홈에서 다시 찾아보세요.',
            home: '홈으로',
            games: '게임 찾기'
          },
          es: {
            title: 'Página no encontrada',
            lead: 'Puede que esta página se haya eliminado o cambiado de dirección, o que la hayas escrito mal. Empieza de nuevo desde la portada.',
            home: 'Ir a la portada',
            games: 'Buscar juegos'
          },
          'zh-CN': {
            title: '找不到这个页面',
            lead: '这个网址可能已经移除、改过，或是网址打错了。从首页开始找找看吧。',
            home: '回首页',
            games: '找游戏'
          }
        };

        // 語言優先權跟系列其他專案一致：手動選過的 cookie > localStorage > 瀏覽器語言
        function detectLang() {
          try {
            var m = document.cookie.match(/(?:^|;\s*)web100_lang=([^;]+)/);
            if (m) {
              var fromCookie = decodeURIComponent(m[1]);
              if (SUPPORTED.indexOf(fromCookie) > -1) return fromCookie;
            }
            var stored = window.localStorage.getItem('web100-lang');
            if (stored && SUPPORTED.indexOf(stored) > -1) return stored;
          } catch (e) {
            /* 無痕模式擋 storage：往下用瀏覽器語言 */
          }

          var tags = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < tags.length; i += 1) {
            var tag = String(tags[i]).toLowerCase();
            for (var j = 0; j < SUPPORTED.length; j += 1) {
              if (SUPPORTED[j].toLowerCase() === tag) return SUPPORTED[j];
            }
            // 中文要看地區才知道繁簡，不能只看 zh 前綴
            if (tag.indexOf('zh') === 0) {
              return tag === 'zh-cn' || tag === 'zh-sg' || tag === 'zh-hans' ? 'zh-CN' : 'zh-TW';
            }
            var base = tag.split('-')[0];
            if (SUPPORTED.indexOf(base) > -1) return base;
          }
          return DEFAULT_LANG;
        }

        var lang = detectLang();
        var s = STRINGS[lang] || STRINGS[DEFAULT_LANG];

        document.documentElement.lang = lang;
        document.title = s.title + ' - Woohop';
        document.getElementById('title').textContent = s.title;
        // 說明一句一塊（inline-block）：寬的時候在句子之間換行，窄的時候每句自己平均分行，不會剩一兩個字（例如「吧。」）掉到最後一行
        var leadEl = document.getElementById('lead');
        s.lead.split(/(?<=[。．！？.!?])\s*/).forEach(function (part) {
          if (!part) return;
          var span = document.createElement('span');
          span.textContent = part;
          leadEl.appendChild(span);
        });
        document.getElementById('brand').href = '/' + lang + '/';

        var home = document.getElementById('home-btn');
        home.textContent = s.home;
        home.href = '/' + lang + '/';
        var games = document.getElementById('games-btn');
        games.textContent = s.games;
        games.href = '/' + lang + '/games/';

        // 插圖：設計系統頁的「找不到」——一臉困惑的小圓球拿放大鏡
        var W = window.Woohop;
        if (W) {
          document.getElementById('art').innerHTML =
            W.ground + W.burst(132, 26, '#FFC628') + W.ring(26, 30, '#F3A4FB') + W.plus(146, 76, '#4FB59A') + W.dot(20, 80, '#FF9419') +
            W.body('<circle cx="66" cy="70" r="34"/>', '#d0daf9', '<path d="M88 40a38 38 0 0 1-32 70h40z" fill="#b8c4f6"/>') +
            W.makeFace('wow', 66, 68, 2) +
            '<path d="M104 92l18 18" stroke="#22222c" stroke-width="8" stroke-linecap="round"/>' +
            W.body('<circle cx="98" cy="84" r="14"/>', '#ffffff', '', false) +
            '<path d="M118 40q4-8 10-4t-2 10" fill="none" stroke="#22222c" stroke-width="3.5" stroke-linecap="round"/><circle cx="125" cy="54" r="2.4" fill="#22222c"/>';
        }
      })();
    </script>
  </body>
</html>
