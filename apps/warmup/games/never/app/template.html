<!doctype html>
<html lang="{{htmlLang}}">
  <head>
    {{head}}
    {{jsonLd}}
  </head>

  <body class="never-app woohop-game" data-screen="setup" data-game-mode="browse">
    {{header}}

    <main id="main" class="never-main game-main">
      <!-- 第 1 步：開場＋選玩法（老闆 11/13：開場選一種，預設「我從來沒有」）。上方的步驟頭是全站共用的 Leader.lead -->
      <div class="view" id="view-setup">
        <div class="page-head">
          <nav class="crumbs" aria-label="breadcrumb">
            <a href="/{{lang}}/">{{crumbHome}}</a><span>›</span><a href="/{{lang}}/games/">{{crumbGames}}</a><span>›</span><span>{{navTitle}}</span>
          </nav>
          <h1>{{heroTitleHtml}}</h1>
          <p>{{heroDesc}}</p>
        </div>

        <div class="lead-slot"></div>

        <section class="panel setup-panel">
          <span class="field-label">{{modeLabel}}</span>
          <div class="seg seg-2" role="radiogroup" aria-label="{{modeLabel}}">
            <label class="seg-item"><input type="radio" name="mode" value="never" checked>{{modeNever}}</label>
            <label class="seg-item"><input type="radio" name="mode" value="did">{{modeDid}}</label>
          </div>
          <p class="hint" id="mode-hint"></p>
        </section>

        <button class="btn btn-lg btn-solid btn-block btn-start" id="start" type="button">{{startButton}}</button>
        <p class="rules-link"><a class="link" href="{{base}}/{{lang}}/rules/">{{rulesLinkText}}</a></p>
      </div>

      <!-- 第 2 步：說明規則。三張插圖卡講規則（Leader.ruleCards），兩種玩法各一組 -->
      <div class="view" id="view-rules" hidden>
        <div class="lead-slot"></div>
        <ol class="rule-cards" id="rule-cards"></ol>
        <button class="btn btn-lg btn-solid btn-block btn-start" id="rules-next" type="button">{{rulesNext}}</button>
      </div>

      <!-- 第 3 步：開始。每一輪一個主題（附例句），一圈說完按「下一輪」；手指是大家自己折的，手機不記分 -->
      <div class="view" id="view-play" hidden>
        <div class="lead-slot"></div>
        <section class="panel topic-panel">
          <!-- 主題卡：第幾輪、大字主題、例句（點一下換一句）；右上角骰子鍵換主題（照果園菜園動物園） -->
          <div class="topic-card">
            <span class="round-tag" id="round-tag"></span>
            <div class="topic-text" aria-live="polite">
              <strong id="topic-name"></strong>
            </div>
            <button class="btn btn-sm btn-secondary topic-shuffle" id="topic-shuffle" type="button" aria-label="{{topicShuffle}}" title="{{topicShuffle}}"><svg aria-hidden="true"><use href="#i-dice"/></svg></button>
            <button class="topic-ex" id="topic-ex" type="button" title="{{exMore}}"><span id="topic-ex-text"></span><svg aria-hidden="true"><use href="#i-arrow"/></svg></button>
          </div>
          <button class="link topic-toggle" id="topic-toggle" type="button" aria-expanded="false" aria-controls="topic-chips">{{topicPick}}</button>
          <div class="topic-chips" id="topic-chips" hidden></div>
        </section>
        <button class="btn btn-lg btn-solid btn-block" id="next-round" type="button">{{nextRound}}</button>
        <!-- 結束要按住，防手滑（跟竹筍同一個做法，app.js 的 HOLD_MS） -->
        <button class="btn btn-lg btn-block end-btn" id="end-btn" type="button">{{endGame}}</button>
      </div>

      <!-- 第 4 步：誰贏了。最後還留著手指的人抽一個動作讓大家模仿、三連拍（老闆 11/16：跟木頭人動作版一樣） -->
      <div class="view" id="view-end" hidden>
        <div class="lead-slot"></div>
        <section class="panel punish-panel">
          <h2>{{punishHeading}}</h2>
          <!-- 動作卡＋隨機抽一個：全站共用的 Leader.actionCard -->
          <div id="punish-root"></div>
        </section>
        <button class="btn btn-lg btn-solid btn-block" id="again" type="button">{{againButton}}</button>
      </div>
    </main>

    <dialog class="modal" id="leave-modal">
      <div class="m-body">
        <h2>{{leaveTitle}}</h2>
        <p>{{leaveDesc}}</p>
      </div>
      <div class="m-actions">
        <button class="btn btn-secondary" id="leave-cancel" type="button">{{leaveCancel}}</button>
        <button class="btn btn-danger" id="leave-confirm" type="button">{{leaveConfirm}}</button>
      </div>
    </dialog>

    {{footer}}

    <script>
      window.NEVER = {
        lang: '{{lang}}',
        base: '{{base}}',
        T: {{stringsJson}},
        actions: {{actionsJson}},
      };
    </script>
    <script src="{{base}}/header.js?v={{assetVersion}}"></script>
    <script src="{{base}}/app.js?v={{assetVersion}}"></script>
  </body>
</html>
