<!doctype html>
<html lang="{{htmlLang}}">
  <head>
    {{head}}
    {{jsonLd}}
  </head>

  <body class="password-app woohop-game" data-screen="setup" data-game-mode="browse">
    {{header}}

    <main id="main" class="password-main game-main">
      <!-- 第 1 步：開場＋選密碼範圍（預設 1～100）。上方的步驟頭是全站共用的 Leader.lead -->
      <div class="view" id="view-setup">
        <div class="page-head">
          <nav class="crumbs" aria-label="breadcrumb">
            <a href="/{{lang}}/">{{crumbHome}}</a><span>›</span><a href="/{{lang}}/games/">{{crumbGames}}</a><span>›</span><span>{{navTitle}}</span>
          </nav>
          <h1>{{heroTitleHtml}}</h1>
          <p>{{heroDesc}}</p>
        </div>

        <div class="lead-slot"></div>

        <section class="panel setup-panel">
          <span class="field-label">{{rangeLabel}}</span>
          <div class="seg seg-3" role="radiogroup" aria-label="{{rangeLabel}}">
            <label class="seg-item"><input type="radio" name="range" value="50">1{{rangeTo}}50</label>
            <label class="seg-item"><input type="radio" name="range" value="100" checked>1{{rangeTo}}100</label>
            <label class="seg-item"><input type="radio" name="range" value="1000">1{{rangeTo}}1000</label>
          </div>
          <p class="hint">{{rangeHint}}</p>
        </section>

        <button class="btn btn-lg btn-solid btn-block btn-start" id="start" type="button">{{startButton}}</button>
        <p class="rules-link"><a class="link" href="{{base}}/{{lang}}/rules/">{{rulesLinkText}}</a></p>
      </div>

      <!-- 第 2 步：說明規則。三張插圖卡講規則（Leader.ruleCards） -->
      <div class="view" id="view-rules" hidden>
        <div class="lead-slot"></div>
        <ol class="rule-cards" id="rule-cards"></ol>
        <button class="btn btn-lg btn-solid btn-block btn-start" id="rules-next" type="button">{{rulesNext}}</button>
      </div>

      <!--
        第 3 步：猜。手機在大家手上傳，不放步驟頭（跟定時炸彈一樣）。
        上面是現在的範圍（大大的兩個數字，猜錯時縮小的那一邊會跳一下），中間是剛剛猜的結果，下面是數字鍵盤
      -->
      <div class="view" id="view-play" hidden>
        <section class="panel range-card" id="range-card">
          <p class="range-label">{{rangeNow}}</p>
          <div class="range-nums" aria-live="polite">
            <span class="range-num" id="range-lo"></span>
            <span class="range-to">{{rangeTo}}</span>
            <span class="range-num" id="range-hi"></span>
          </div>
          <p class="range-msg" id="range-msg" aria-live="polite"></p>
          <p class="range-count" id="range-count"></p>
        </section>

        <section class="panel guess-panel">
          <div class="guess-row">
            <span class="guess-label">{{guessLabel}}</span>
            <output class="guess-value" id="guess-value" aria-live="polite"></output>
          </div>
          <!-- 數字鍵盤：自己畫，不叫出手機鍵盤（手機鍵盤會蓋住範圍，傳手機時也容易誤觸） -->
          <div class="keypad" id="keypad">
            <button class="key" type="button" data-key="1">1</button>
            <button class="key" type="button" data-key="2">2</button>
            <button class="key" type="button" data-key="3">3</button>
            <button class="key" type="button" data-key="4">4</button>
            <button class="key" type="button" data-key="5">5</button>
            <button class="key" type="button" data-key="6">6</button>
            <button class="key" type="button" data-key="7">7</button>
            <button class="key" type="button" data-key="8">8</button>
            <button class="key" type="button" data-key="9">9</button>
            <button class="key key-del" type="button" data-key="del" aria-label="{{clearKey}}">⌫</button>
            <button class="key" type="button" data-key="0">0</button>
            <button class="key key-go" type="button" data-key="go" id="guess-go" disabled>{{guessButton}}</button>
          </div>
        </section>
      </div>

      <!-- 第 4 步：爆炸。猜中密碼的人拉真心話大冒險拉霸（全站共用的 Leader.slot），炸彈插圖照抄定時炸彈 -->
      <div class="view" id="view-boom" hidden>
        <div class="lead-slot"></div>
        <div class="panel boom-card">
          <div class="boom-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path
                d="m32 2 6.6 12.2L51 8.6l-3.4 13.2 13.6-.9-9.4 9.9 12.2 6.2-12.2 6.2 9.4 9.9-13.6-.9L51 55.4l-12.4-5.6L32 62l-6.6-12.2L13 55.4l3.4-13.2-13.6.9 9.4-9.9L0 27l12.2-6.2-9.4-9.9 13.6.9L13 8.6l12.4 5.6L32 2Z"
              />
            </svg>
          </div>
          <h1 id="boom-title"></h1>
          <p class="boom-stats" id="boom-stats"></p>
          <div id="slot-root"></div>
        </div>
        <button class="btn btn-lg btn-solid btn-block" id="again" type="button">{{againButton}}</button>
      </div>
    </main>

    <dialog class="modal" id="leave-modal">
      <div class="m-body">
        <h2>{{leaveTitle}}</h2>
        <p>{{leaveDesc}}</p>
      </div>
      <div class="m-actions">
        <button class="btn btn-secondary" id="leave-cancel" type="button">{{leaveCancel}}</button>
        <button class="btn btn-danger" id="leave-confirm" type="button">{{leaveConfirm}}</button>
      </div>
    </dialog>

    {{footer}}

    <script>
      window.PASSWORD = {
        lang: '{{lang}}',
        base: '{{base}}',
        T: {{stringsJson}},
        slot: {{slotJson}},
      };
    </script>
    <script src="{{base}}/header.js?v={{assetVersion}}"></script>
    <script src="{{base}}/app.js?v={{assetVersion}}"></script>
  </body>
</html>
