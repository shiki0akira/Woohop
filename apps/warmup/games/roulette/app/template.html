<!doctype html>
<html lang="{{htmlLang}}">
  <head>
    {{head}}
    {{jsonLd}}
  </head>

  <body class="roulette-app woohop-game" data-screen="setup" data-game-mode="browse">
    {{header}}

    <main id="main" class="roulette-main game-main">
      <!-- 第 1 步：開場＋設定（幾個人、會爆幾發；彈夾格數預設等於人數，收在「自己調」底下。老闆 11/23） -->
      <div class="view" id="view-setup">
        <div class="page-head">
          <nav class="crumbs" aria-label="breadcrumb">
            <a href="/{{lang}}/">{{crumbHome}}</a><span>›</span><a href="/{{lang}}/games/">{{crumbGames}}</a><span>›</span><span>{{navTitle}}</span>
          </nav>
          <h1>{{heroTitleHtml}}</h1>
          <p>{{heroDesc}}</p>
        </div>

        <div class="lead-slot"></div>

        <section class="panel setup-panel">
          <span class="field-label">{{playersLabel}}</span>
          <div class="stepper">
            <button type="button" id="players-less" aria-label="{{playersLess}}">−</button>
            <output id="players-value" aria-live="polite"></output>
            <button type="button" id="players-more" aria-label="{{playersMore}}">+</button>
          </div>
          <!-- 格數照人數分級自動裝（老闆 11/23：4 人以下 6 格、5～8 人 12 格），格數和會爆幾發收在「自己調」底下 -->
          <button class="link chambers-toggle" id="chambers-toggle" type="button" aria-expanded="false" aria-controls="chambers-panel">{{chambersToggle}}</button>
          <div class="setup-row" id="chambers-panel" hidden>
            <div>
              <span class="field-label">{{chambersLabel}}</span>
              <div class="stepper">
                <button type="button" id="chambers-less" aria-label="{{chambersLess}}">−</button>
                <output id="chambers-value" aria-live="polite"></output>
                <button type="button" id="chambers-more" aria-label="{{chambersMore}}">+</button>
              </div>
            </div>
            <div>
              <span class="field-label">{{bangsLabel}}</span>
              <div class="stepper">
                <button type="button" id="bangs-less" aria-label="{{bangsLess}}">−</button>
                <output id="bangs-value" aria-live="polite"></output>
                <button type="button" id="bangs-more" aria-label="{{bangsMore}}">+</button>
              </div>
            </div>
          </div>
          <p class="hint" id="setup-hint"></p>
        </section>

        <button class="btn btn-lg btn-solid btn-block btn-start" id="start" type="button">{{startButton}}</button>
        <p class="rules-link"><a class="link" href="{{base}}/{{lang}}/rules/">{{rulesLinkText}}</a></p>
      </div>

      <!-- 第 2 步：說明規則。三張插圖卡（Leader.ruleCards） -->
      <div class="view" id="view-rules" hidden>
        <div class="lead-slot"></div>
        <ol class="rule-cards" id="rule-cards"></ol>
        <button class="btn btn-lg btn-solid btn-block btn-start" id="rules-next" type="button">{{rulesNext}}</button>
      </div>

      <!-- 第 3 步：手機在大家手上傳，一人拉一下。不放步驟頭（apps/warmup/CLAUDE.md 的規則） -->
      <div class="view" id="view-play" hidden>
        <section class="panel play-panel">
          <div class="play-status">
            <span id="chambers-left"></span>
            <span id="bangs-left"></span>
          </div>
          <!-- 彈夾：一格一個圓，拉過的變成打勾、砰過的變成星星 -->
          <ol class="cylinder" id="cylinder" aria-hidden="true"></ol>
          <div class="popper-stage" id="popper-stage">
            <svg class="popper-art" id="popper-art" viewBox="0 0 160 126" role="img" aria-label="{{popperAlt}}"></svg>
          </div>
          <p class="play-title" id="play-title" aria-live="polite"></p>
          <p class="play-hint" id="play-hint"></p>
        </section>
        <button class="btn btn-lg btn-solid btn-block pull-btn" id="pull" type="button">{{pullButton}}</button>
        <button class="btn btn-lg btn-secondary btn-block" id="pass" type="button" hidden>{{passButton}}</button>
      </div>

      <!-- 第 4 步：全部砰完才來這裡（老闆 11/23），照著念念出第幾位中了，中的人一個一個拉真心話大冒險拉霸 -->
      <div class="view" id="view-pop" hidden>
        <div class="lead-slot"></div>
        <section class="panel pop-panel">
          <div id="slot-root"></div>
        </section>
        <button class="btn btn-lg btn-solid btn-block" id="again" type="button">{{againButton}}</button>
      </div>
    </main>

    <!-- 砰的那一下：全畫面噴彩帶（app.js 的 confetti），不擋點擊 -->
    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <dialog class="modal" id="leave-modal">
      <div class="m-body">
        <h2>{{leaveTitle}}</h2>
        <p>{{leaveDesc}}</p>
      </div>
      <div class="m-actions">
        <button class="btn btn-secondary" id="leave-cancel" type="button">{{leaveCancel}}</button>
        <button class="btn btn-danger" id="leave-confirm" type="button">{{leaveConfirm}}</button>
      </div>
    </dialog>

    {{footer}}

    <script>
      window.ROULETTE = {
        lang: '{{lang}}',
        base: '{{base}}',
        T: {{stringsJson}},
        slot: {{slotJson}},
      };
    </script>
    <script src="{{base}}/header.js?v={{assetVersion}}"></script>
    <script src="{{base}}/app.js?v={{assetVersion}}"></script>
  </body>
</html>
