<!doctype html>
<html lang="{{htmlLang}}">
  <head>
    {{head}}
    {{jsonLd}}
  </head>

  <body class="bomb-app bomb-game" data-screen="rules">
    {{header}}

    <main id="main" class="bomb-main bomb-rules">
      <div class="page-head">
        <nav class="crumbs" aria-label="breadcrumb">
          <a href="/{{lang}}/">{{crumbHome}}</a><span>›</span><a href="/{{lang}}/games/">{{crumbGames}}</a><span>›</span><a href="{{base}}/{{lang}}/">{{navTitle}}</a><span>›</span><span>{{navRules}}</span>
        </nav>
        <h1>{{rulesTitle}}</h1>
        <p>{{rulesIntro}}</p>
      </div>

      <!-- 一眼看到：幾個人、多久、要準備什麼 -->
      <ul class="rules-facts">
        {{rulesFactsList}}
      </ul>

      <section class="panel prose">
        <h2>{{rulesHowHeading}}</h2>
        <ol>
          {{rulesHowList}}
        </ol>
      </section>

      <section class="panel prose rules-lead">
        <h2>{{rulesLeadHeading}}</h2>
        <ul>
          {{rulesLeadList}}
        </ul>
      </section>

      <p class="rules-back"><a class="btn btn-lg btn-solid" href="{{base}}/{{lang}}/">{{rulesBack}}</a></p>
    </main>

    {{footer}}

    <script>
      window.BOMB = { lang: '{{lang}}', base: '{{base}}', page: 'rules/' };
    </script>
    <script src="{{base}}/header.js?v={{assetVersion}}"></script>
  </body>
</html>
