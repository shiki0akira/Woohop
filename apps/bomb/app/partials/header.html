{{woohopHeader}}

    <!--
      遊戲內頂欄（設計系統「導覽」那一節的手機頂欄）：遊戲頁與玩法頁共用，取代網站導覽列。
      左邊返回：設定畫面回「找遊戲」、玩法頁回遊戲、進行中先跳確認、爆炸畫面回設定。
      右邊的「玩法」「設定」分頁與選單鍵只在設定畫面與玩法頁出現；玩的時候不放，誤點出去這一輪就沒了。
      手機上分頁一樣留在頂欄（字小一號），選單鍵打開的底部面板只放網站的頁面。
    -->
    <div class="game-bar-host">
      <div class="appbar game-bar">
        <button class="btn btn-icon btn-ghost" id="game-back" type="button" aria-label="{{gameBack}}"><svg><use href="#i-back"/></svg></button>
        <div class="title">{{navTitle}}</div>
        <nav class="game-tabs" aria-label="{{navTitle}}">
          <a href="{{base}}/{{lang}}/rules/"{{rulesCurrent}} aria-label="{{navRules}}"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5M8 8h8M8 12h5"/></svg><span class="tab-text">{{navRules}}</span></a>
          <!-- 設定：裡面是自訂題目（#custom-modal）。加過幾題就把題數靠在字旁邊 -->
          <button type="button" id="open-custom" aria-label="{{settingsTab}}"><svg class="tab-icon gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span class="tab-text">{{settingsTab}}</span><span class="custom-open-count" id="custom-open-count"></span></button>
        </nav>
        <!-- 選單：電腦上是往下開的下拉（跟網站導覽列的「更多」同一種，開關由 site.js 處理），
             手機上改開底部面板（header.js 攔下來） -->
        <div class="nav-more game-menu">
          <button class="btn btn-icon btn-ghost" id="game-menu" type="button" aria-label="{{menuLabel}}" aria-expanded="false" aria-haspopup="true"><svg><use href="#i-menu"/></svg></button>
          <div class="nav-menu" hidden>{{gameMenuLinks}}</div>
        </div>
        <span class="game-bar-spacer" aria-hidden="true"></span>
      </div>
    </div>

    <!-- 手機上的選單（頂欄右上角的選單鍵）：網站的頁面。玩法、設定已經在頂欄上 -->
    <dialog class="sheet" id="game-sheet" aria-label="{{menuLabel}}" tabindex="-1">
      <div class="grabber"></div>
      <div class="sheet-list">
        {{gameSheetLinks}}
      </div>
      <div class="sheet-foot"><button class="btn btn-ghost" type="button" data-close>{{closeLabel}}</button></div>
    </dialog>
